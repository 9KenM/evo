<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stellar Evolution</title>
  </head>
  <body>
    <div id="viewport">
      <canvas id="canvas">Canvas not supported</canvas>
    </div>

    <header id="controls">
      <button id="play" type="button" aria-label="Play">▶</button>
      <label for="mass">Mass <input id="mass" type="text" inputmode="decimal" size="6" /> M☉</label>
      <label for="age">Age <input id="age" type="text" inputmode="decimal" size="8" /> Gyr</label>
      <label for="timescale">
        Speed <input id="timescale" type="text" inputmode="decimal" size="6" /> Gyr/s
      </label>
      <button id="recentre" type="button">Recentre</button>
    </header>

    <aside id="info"></aside>

    <script type="module" src="/src/app.ts"></script>
  </body>
</html>
